name: CI

on:
  push:
    branches: [main, v2.x]
  pull_request:
    branches: [main, v2.x]
  schedule:
    # Weekly canary: catches fresh-install breakage from unpinned upstream
    # releases between pushes (mcp 2.0.0 broke installs with zero red CI).
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert mcp SDK major version (2.x)
        run: |
          python -c "from importlib.metadata import version; v = version('mcp'); assert int(v.split('.')[0]) == 2, f'mcp resolved to {v}, expected 2.x - the <2 cap in pyproject.toml is not being enforced'"

      - name: Lint
        run: ruff check src/

      - name: Type check
        run: mypy src/

      - name: Run tests
        run: pytest tests/ -v

  core-only:
    # Regression gate for headless consumers (e.g. Catence) that install
    # only the client/auth core: no MCP SDK, no keyring, no cryptography.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create core-only venv (no extras)
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install --upgrade pip
          /tmp/core/bin/pip install .
      - name: Assert optional backends are absent
        run: |
          ! /tmp/core/bin/python -c "import keyring" ; ! /tmp/core/bin/python -c "import cryptography" ; ! /tmp/core/bin/python -c "import mcp"
      - name: Client/auth core imports and env auth works without backends
        run: |
          /tmp/core/bin/python - <<'EOF'
          import os
          os.environ["TP_AUTH_COOKIE"] = "ci-fake-cookie"
          import tp_mcp.client, tp_mcp.auth, tp_mcp.core_cli
          cred = tp_mcp.auth.get_credential()
          assert cred.success and cred.cookie == "ci-fake-cookie", cred
          print("core-only env auth OK; backend:", tp_mcp.auth.get_storage_backend())
          EOF

  legacy-client:
    # Release-blocking compat gate: a REAL SDK 1.x client must work against
    # the v2 server (deterministic - does not depend on any vendor's rollout).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server (SDK 2.x)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Create legacy client venv (mcp 1.26.0)
        run: |
          python -m venv /tmp/legacy
          /tmp/legacy/bin/pip install 'mcp==1.26.0'

      - name: Drive v2 server with the 1.x ClientSession
        run: /tmp/legacy/bin/python scripts/legacy_client_check.py tp-mcp serve
